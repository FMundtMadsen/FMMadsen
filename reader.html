<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Essay | Filip M. Madsen</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

:root {
  --bg: #05070d;
  --text: #ffffff;
  --muted: #9a9a9a;
  --accent: #ff4da6;
  --line: rgba(255,255,255,0.08);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}


/* =========================
   MAIN READER
========================= */

.reader {
  width: min(920px, calc(100% - 40px));
  margin: 0 auto;
  padding: 52px 0 110px;
}


/* =========================
   TOP NAVIGATION
========================= */

.top-nav {
  margin-bottom: 58px;
}

.top-nav a {
  color: var(--accent);
  text-decoration: none;
  font-size: 0.95rem;
}

.top-nav a:hover {
  opacity: 0.75;
}


/* =========================
   ESSAY HEADER
========================= */

.essay-header {
  margin-bottom: 54px;
}

.essay-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.essay-label {
  color: var(--accent);
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.essay-number {
  color: var(--muted);
  font-size: 0.8rem;
  font-weight: 400;
  letter-spacing: 0.08em;
}

h1 {
  font-size: clamp(2.2rem, 6vw, 4rem);
  line-height: 1.08;
  letter-spacing: -0.035em;
  margin: 0 0 20px;
  font-weight: 700;
}

.subtitle {
  color: var(--muted);
  font-size: clamp(1rem, 2vw, 1.15rem);
  line-height: 1.65;
  max-width: 660px;
  margin: 0;
}


/* =========================
   DIVIDER
========================= */

.divider {
  height: 1px;
  background: var(--line);
  margin: 0 0 54px;
}


/* =========================
   IMAGES / SLIDES
========================= */

.slide {
  margin-bottom: 64px;
}

.slide img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 6px;
}

.page-count {
  color: var(--muted);
  font-size: 0.8rem;
  text-align: right;
  margin-top: 10px;
}


/* =========================
   SWIPE DOTS
========================= */

.swipe-dots {
  display: none;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-top: 18px;
  margin-bottom: 18px;
}

.swipe-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  transition: all 0.2s ease;
}

.swipe-dot.active {
  background: var(--accent);
  transform: scale(1.25);
}


/* =========================
   BOTTOM NAVIGATION
========================= */

.bottom-nav {
  margin-top: 82px;
  padding-top: 28px;
  border-top: 1px solid var(--line);

  display: flex;
  justify-content: space-between;
  align-items: flex-start;

  gap: 30px;
}

.bottom-nav a {
  color: var(--accent);
  text-decoration: none;
  font-size: 0.95rem;
  line-height: 1.5;
  max-width: 45%;
}

.bottom-nav a:last-child {
  text-align: right;
}

.bottom-nav a:hover {
  opacity: 0.75;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

  .reader {
    width: calc(100% - 28px);
    padding: 30px 0 75px;
  }


  /* Back link */

  .top-nav {
    margin-bottom: 38px;
  }

  .top-nav a {
    font-size: 1.05rem;
  }


  /* Heading area */

  .essay-header {
    margin-bottom: 34px;
  }

  .essay-meta {
    margin-bottom: 16px;
  }

  .essay-label {
    font-size: 0.9rem;
  }

  .essay-number {
    font-size: 0.95rem;
  }

  h1 {
    font-size: 2.25rem;
    line-height: 1.12;
    margin-bottom: 18px;
  }

  .subtitle {
    font-size: 1.08rem;
    line-height: 1.65;
  }


  /* Divider */

  .divider {
    margin-bottom: 30px;
  }


  /* =================================
     MULTI-PAGE STORIES: SWIPE
  ================================= */

  #slides.multi-page {
    display: flex;

    width: 100%;

    overflow-x: auto;
    overflow-y: hidden;

    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;

    gap: 14px;

    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;

    overscroll-behavior-x: contain;
  }

  #slides.multi-page::-webkit-scrollbar {
    display: none;
  }

  #slides.multi-page .slide {
    flex: 0 0 100%;
    min-width: 100%;

    scroll-snap-align: start;
    scroll-snap-stop: always;

    margin: 0;
  }

  #slides.multi-page .slide img {
    width: 100%;
    height: auto;
  }

  #slides.multi-page .page-count {
    font-size: 0.95rem;
    margin-top: 10px;
  }


  /* Show dots only for swipe stories */

  .swipe-dots.visible {
    display: flex;
  }


  /* Single-image essays stay normal */

  #slides.single-page .slide {
    margin-bottom: 34px;
  }


  /* Previous / next stories */

  .bottom-nav {
    margin-top: 48px;
    padding-top: 24px;

    display: flex;
    flex-direction: row;

    justify-content: space-between;
    align-items: flex-start;

    gap: 20px;
  }

  .bottom-nav a {
    font-size: 1.05rem;
    line-height: 1.45;
    max-width: 47%;
  }

}

</style>
</head>


<body>

<div class="reader">


  <!-- BACK TO LIBRARY -->

  <div class="top-nav">
    <a href="essays.html">← Back to Past Essays</a>
  </div>


  <!-- ESSAY HEADER -->

  <header class="essay-header">

    <div class="essay-meta">

      <div
        class="essay-label"
        id="label">
      </div>

      <div
        class="essay-number"
        id="number">
      </div>

    </div>

    <h1 id="title"></h1>

    <p
      class="subtitle"
      id="subtitle">
    </p>

  </header>


  <div class="divider"></div>


  <!-- IMAGES -->

  <main id="slides"></main>


  <!-- MOBILE SWIPE DOTS -->

  <div
    class="swipe-dots"
    id="swipeDots">
  </div>


  <!-- PREVIOUS / NEXT STORY -->

  <nav class="bottom-nav">

    <a
      id="previous"
      href="#">
    </a>

    <a
      id="next"
      href="#">
    </a>

  </nav>


</div>


<script>

/* =====================================================
   ESSAY LIBRARY

   THIS IS THE MAIN SECTION YOU UPDATE
   WHEN YOU ADD FUTURE STORIES.
===================================================== */

const essays = {


  welcome: {

    number: "01",

    title:
      "Welcome to Molecular Dominoes",

    subtitle:
      "An overview of my mission as a science lecturer.",

    images: [
      "essays/000_WelcomeToMolecularDominoes.png"
    ],

    previous: "cells",
    next: "molecular"
  },


  molecular: {

    number: "02",

    title:
      "Molecular Dominoes",

    subtitle:
      "Our cells work through endless chains of molecular dominoes falling.",

    images: [
      "essays/001_MolecularDominoes.png"
    ],

    previous: "welcome",
    next: "chimpanzee"
  },


  chimpanzee: {

    number: "03",

    title:
      "I'm a Chimpanzee",

    subtitle:
      "Genetically, so are you.",

    images: [
      "essays/002_ImAChimpanzee.png"
    ],

    previous: "molecular",
    next: "dogma"
  },


  dogma: {

    number: "04",

    title:
      "The Central Dogma of Molecular Biology",

    subtitle:
      "How small genetic changes lead to massive differences.",

    images: [
      "stories/central-dogma/1.png",
      "stories/central-dogma/2.png"
    ],

    previous: "chimpanzee",
    next: "cells"
  },


  cells: {

    number: "05",

    title:
      "You Are Made of Cells",

    subtitle:
      "Your body feels like one thing. It isn't.",

    images: [
      "stories/cells/1.png",
      "stories/cells/2.png",
      "stories/cells/3.png"
    ],

    previous: "dogma",
    next: "welcome"
  }


};


/* =====================================================
   READER
===================================================== */

const params =
  new URLSearchParams(window.location.search);

const essayId =
  params.get("id");

const essay =
  essays[essayId];


const title =
  document.getElementById("title");

const subtitle =
  document.getElementById("subtitle");

const label =
  document.getElementById("label");

const number =
  document.getElementById("number");

const slides =
  document.getElementById("slides");

const swipeDots =
  document.getElementById("swipeDots");

const previous =
  document.getElementById("previous");

const next =
  document.getElementById("next");


/* =====================================================
   ESSAY NOT FOUND
===================================================== */

if (!essay) {

  title.textContent =
    "Essay not found";

  subtitle.textContent =
    "This essay may have moved or the link may be incorrect.";

  label.textContent = "";
  number.textContent = "";

  previous.style.display = "none";
  next.style.display = "none";


} else {


  /* ===================================================
     PAGE INFORMATION
  =================================================== */

  document.title =
    essay.title + " | Filip M. Madsen";

  title.textContent =
    essay.title;

  subtitle.textContent =
    essay.subtitle;

  number.textContent =
    "#" + essay.number;


  label.textContent =
    essay.images.length === 1
      ? "Visual essay"
      : essay.images.length + "-page visual story";


  /* ===================================================
     SINGLE VS MULTI-PAGE
  =================================================== */

  if (essay.images.length > 1) {

    slides.classList.add("multi-page");
    swipeDots.classList.add("visible");

  } else {

    slides.classList.add("single-page");

  }


  /* ===================================================
     CREATE IMAGES
  =================================================== */

  essay.images.forEach((src, index) => {


    const wrapper =
      document.createElement("section");

    wrapper.className =
      "slide";


    const img =
      document.createElement("img");

    img.src =
      src;

    img.alt =
      essay.title +
      " — page " +
      (index + 1);

    img.loading =
      index === 0
        ? "eager"
        : "lazy";


    wrapper.appendChild(img);


    /* Page counter */

    if (essay.images.length > 1) {

      const count =
        document.createElement("div");

      count.className =
        "page-count";

      count.textContent =
        (index + 1) +
        " / " +
        essay.images.length;

      wrapper.appendChild(count);

    }


    slides.appendChild(wrapper);


    /* Swipe dots */

    if (essay.images.length > 1) {

      const dot =
        document.createElement("span");

      dot.className =
        "swipe-dot";

      if (index === 0) {
        dot.classList.add("active");
      }

      swipeDots.appendChild(dot);

    }

  });


  /* ===================================================
     UPDATE SWIPE DOT WHEN USER SWIPES
  =================================================== */

  if (essay.images.length > 1) {

    const dots =
      swipeDots.querySelectorAll(".swipe-dot");


    slides.addEventListener("scroll", () => {

      const slideWidth =
        slides.clientWidth;

      if (!slideWidth) {
        return;
      }


      const index =
        Math.round(
          slides.scrollLeft /
          (slideWidth + 14)
        );


      dots.forEach((dot, i) => {

        dot.classList.toggle(
          "active",
          i === index
        );

      });

    });

  }


  /* ===================================================
     PREVIOUS STORY
     CIRCULAR NAVIGATION
  =================================================== */

  if (
    essay.previous &&
    essays[essay.previous]
  ) {

    previous.href =
      "reader.html?id=" +
      essay.previous;

    previous.textContent =
      "← " +
      essays[essay.previous].title;

  }


  /* ===================================================
     NEXT STORY
     CIRCULAR NAVIGATION
  =================================================== */

  if (
    essay.next &&
    essays[essay.next]
  ) {

    next.href =
      "reader.html?id=" +
      essay.next;

    next.textContent =
      essays[essay.next].title +
      " →";

  }


}

</script>

</body>
</html>

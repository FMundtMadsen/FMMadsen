<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Essay | Filip M. Madsen</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #05070d;
  --text: #ffffff;
  --muted: #9a9a9a;
  --accent: #ff4da6;
  --line: rgba(255,255,255,0.08);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Main reading column */
.reader {
  width: min(920px, calc(100% - 40px));
  margin: 0 auto;
  padding: 52px 0 110px;
}

/* Top navigation */
.top-nav {
  margin-bottom: 58px;
}

.top-nav a {
  color: var(--accent);
  text-decoration: none;
  font-size: 0.9rem;
}

.top-nav a:hover {
  opacity: 0.75;
}

/* Essay heading */
.essay-header {
  margin-bottom: 54px;
}

.essay-label {
  color: var(--accent);
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 14px;
}

h1 {
  font-size: clamp(2.2rem, 6vw, 4rem);
  line-height: 1.08;
  letter-spacing: -0.035em;
  margin: 0 0 20px;
  font-weight: 700;
}

.subtitle {
  color: var(--muted);
  font-size: clamp(1rem, 2vw, 1.15rem);
  line-height: 1.65;
  max-width: 660px;
  margin: 0;
}

/* Thin editorial divider */
.divider {
  height: 1px;
  background: var(--line);
  margin: 0 0 54px;
}

/* Slide/page */
.slide {
  margin-bottom: 64px;
}

.slide img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 6px;
}

.page-count {
  color: var(--muted);
  font-size: 0.78rem;
  text-align: right;
  margin-top: 10px;
}

/* Bottom navigation */
.bottom-nav {
  margin-top: 82px;
  padding-top: 28px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  gap: 20px;
}

.bottom-nav a {
  color: var(--accent);
  text-decoration: none;
  font-size: 0.9rem;
}

.bottom-nav a:hover {
  opacity: 0.75;
}

/* Mobile */
@media (max-width: 768px) {

  .reader {
    width: calc(100% - 28px);
    padding: 34px 0 80px;
  }

  .top-nav {
    margin-bottom: 38px;
  }

  .essay-header {
    margin-bottom: 36px;
  }

  .divider {
    margin-bottom: 36px;
  }

  /* Multi-page stories become swipeable */
  #slides.multi-page {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    gap: 14px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }

  #slides.multi-page::-webkit-scrollbar {
    display: none;
  }

  #slides.multi-page .slide {
    flex: 0 0 100%;
    scroll-snap-align: start;
    margin-bottom: 0;
  }

  /* Single-page essays remain normal */
  #slides.single-page .slide {
    margin-bottom: 34px;
  }

  .bottom-nav {
    margin-top: 55px;
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div class="reader">

  <div class="top-nav">
    <a href="essays.html">← Back to Past Essays</a>
  </div>

  <header class="essay-header">
    <div class="essay-label" id="label"></div>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <div class="divider"></div>

  <main id="slides"></main>

  <nav class="bottom-nav">
    <a id="previous" href="#"></a>
    <a id="next" href="#"></a>
  </nav>

</div>

<script>

/* =========================================
   ESSAY LIBRARY
   Add future essays here.
========================================= */

const essays = {

  welcome: {
    title: "Welcome to Molecular Dominoes",
    subtitle: "An overview of my mission as a science lecturer.",
    images: [
      "essays/000_WelcomeToMolecularDominoes.png"
    ],
    previous: null,
    next: "molecular"
  },

  molecular: {
    title: "Molecular Dominoes",
    subtitle: "Our cells work through endless chains of molecular dominoes falling.",
    images: [
      "essays/001_MolecularDominoes.png"
    ],
    previous: "welcome",
    next: "chimpanzee"
  },

  chimpanzee: {
    title: "I'm a Chimpanzee",
    subtitle: "Genetically, so are you.",
    images: [
      "essays/002_ImAChimpanzee.png"
    ],
    previous: "molecular",
    next: "dogma"
  },

  dogma: {
    title: "The Central Dogma of Molecular Biology",
    subtitle: "How small genetic changes lead to massive differences.",
    images: [
      "stories/central-dogma/1.png",
      "stories/central-dogma/2.png",
      "stories/central-dogma/3.png"
    ],
    previous: "chimpanzee",
    next: "cells"
  },

  cells: {
    title: "You Are Made of Cells",
    subtitle: "Your body feels like one thing. It isn't.",
    images: [
      "stories/cells/1.png",
      "stories/cells/2.png",
      "stories/cells/3.png"
    ],
    previous: "dogma",
    next: null
  }

};


/* =========================================
   READER LOGIC
========================================= */

const params = new URLSearchParams(window.location.search);
const essayId = params.get("id");
const essay = essays[essayId];

const title = document.getElementById("title");
const subtitle = document.getElementById("subtitle");
const label = document.getElementById("label");
const slides = document.getElementById("slides");

const previous = document.getElementById("previous");
const next = document.getElementById("next");

if (!essay) {

  title.textContent = "Essay not found";
  subtitle.textContent = "This essay may have moved or the link may be incorrect.";
  label.textContent = "";

  previous.style.display = "none";
  next.style.display = "none";

} else {

  document.title = essay.title + " | Filip M. Madsen";

  title.textContent = essay.title;
  subtitle.textContent = essay.subtitle;

  label.textContent =
    essay.images.length === 1
      ? "Visual essay"
      : essay.images.length + "-page visual story";
  if (essay.images.length > 1) {
  slides.classList.add("multi-page");
} else {
  slides.classList.add("single-page");
}

  essay.images.forEach((src, index) => {

    const wrapper = document.createElement("section");
    wrapper.className = "slide";

    const img = document.createElement("img");
    img.src = src;
    img.alt = essay.title + " — page " + (index + 1);
    img.loading = "lazy";

    wrapper.appendChild(img);

    if (essay.images.length > 1) {
      const count = document.createElement("div");
      count.className = "page-count";
      count.textContent = (index + 1) + " / " + essay.images.length;
      wrapper.appendChild(count);
    }

    slides.appendChild(wrapper);
  });

  if (essay.previous && essays[essay.previous]) {
    previous.href = "reader.html?id=" + essay.previous;
    previous.textContent = "← " + essays[essay.previous].title;
  } else {
    previous.style.visibility = "hidden";
  }

  if (essay.next && essays[essay.next]) {
    next.href = "reader.html?id=" + essay.next;
    next.textContent = essays[essay.next].title + " →";
  } else {
    next.style.visibility = "hidden";
  }
}

</script>

</body>
</html>
